<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Database</title>

        <!-- Tailwind CSS CDN -->
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                darkMode: "class",
                theme: {
                    extend: {
                        fontFamily: {
                            sans: [
                                "Inter",
                                "system-ui",
                                "-apple-system",
                                "sans-serif",
                            ],
                        },
                        colors: {
                            background: "hsl(var(--background))",
                            muted: {
                                DEFAULT: "hsl(var(--muted))",
                                foreground: "hsl(var(--muted-foreground))",
                            },
                            accent: "hsl(var(--accent))",
                        },
                    },
                },
            };
        </script>

        <!-- Theme detection script (runs before render to prevent flash) -->
        <script>
            (function () {
                const params = new URLSearchParams(window.location.search);
                const themeParam = params.get("theme");
                let isDark;
                if (themeParam === "dark") {
                    isDark = true;
                } else if (themeParam === "light") {
                    isDark = false;
                } else if (localStorage.getItem("darkMode") !== null) {
                    isDark = localStorage.getItem("darkMode") === "true";
                } else {
                    isDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
                }
                if (isDark) document.documentElement.classList.add("dark");
            })();
        </script>

        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lexend:wght@100..900&family=Fira+Mono:wght@400;500;700&display=swap"
            rel="stylesheet"
        />

        <style>
            tiro-form-filler {
                display: block;
                height: 100%;
            }

            details summary::-webkit-details-marker {
                display: none;
            }

            details summary {
                list-style: none;
            }

            details[open] .chevron {
                transform: rotate(180deg);
            }

            :root {
                --background: 0 0% 100%;
                --muted: 210 40% 96.1%;
                --muted-foreground: 215.4 16.3% 46.9%;
                --accent: 210 40% 90%;
                --dropdown-bg: #ffffff;
                --dropdown-text: #374151;
                --dropdown-text-muted: #6b7280;
                --dropdown-border: #d1d5db;
                --dropdown-border-hover: #9ca3af;
                --dropdown-hover: #f3f4f6;
                --dropdown-disabled-bg: #eceef0;
                --dropdown-disabled-text: #9ca3af;
                --dropdown-disabled-border: #d1d5db;
                --dropdown-multi-value-bg: #e5e7eb;
                --dropdown-multi-value-hover: #d1d5db;
                --dropdown-focus-ring: #006cd9;
                --dropdown-indicator-color: #374151;
            }
            :root.dark {
                --background: 206 27% 17%;   /* #1f2c36 — panels and form fields */
                --foreground: 215 20% 85%;
                --card: 206 27% 17%;
                --card-foreground: 215 20% 85%;
                --popover: 206 27% 17%;
                --popover-foreground: 215 20% 85%;
                --primary: 174 69% 20%;       /* #105750 — teal primary */
                --primary-foreground: 0 0% 100%;
                --secondary: 0 0% 24%;
                --secondary-foreground: 215 20% 85%;
                --muted: 0 0% 24%;            /* #3D3D3D — inactive buttons and secondary surfaces */
                --muted-foreground: 215 15% 55%;
                --accent: 210 30% 20%;        /* #243342 — hover states */
                --accent-foreground: 215 20% 85%;
                --input: 206 27% 17%;         /* #1f2c36 — input field backgrounds */
                --border: 206 26% 24%;        /* #2d3f4d — borders */
                --ring: 174 69% 20%;          /* #105750 — focus rings */
                --dropdown-bg: #1f2c36;
                --dropdown-text: #d1d9e1;
                --dropdown-text-muted: #8896a8;
                --dropdown-border: #2d3f4d;
                --dropdown-border-hover: #3a5068;
                --dropdown-hover: #243342;
                --dropdown-disabled-bg: #1a2530;
                --dropdown-disabled-text: #4b6080;
                --dropdown-disabled-border: #2d3f4d;
                --dropdown-multi-value-bg: #243342;
                --dropdown-multi-value-hover: #2d3f4d;
                --dropdown-focus-ring: #105750;
                --dropdown-indicator-color: #d1d9e1;
            }

            /* PACSonWeb dark mode: exact color overrides */
            :root.dark body {
                background-color: #161f27 !important;
            }
            :root.dark input:not([type="checkbox"]):not([type="radio"]),
            :root.dark select,
            :root.dark textarea {
                background-color: #1f2c36 !important;
                border-color: #2d3f4d !important;
            }
            :root.dark .bg-cyan-600 {
                background-color: #105750 !important;
            }
            :root.dark .hover\:bg-cyan-700:hover {
                background-color: #0b3e39 !important;
            }
            :root.dark .border-slate-700 {
                border-color: #2d3f4d !important;
            }
        </style>
    </head>
    <body class="bg-neutral-50 text-neutral-800 dark:bg-[#161f27] dark:text-neutral-200">

        <!-- Floating action buttons (top-right), zoals op qc.html -->
        <!-- items-start: de stapel met "mail versturen" is hoger, zo blijven de
             bovenranden van alle knoppen op één lijn -->
        <div class="fixed top-4 right-4 z-50 flex gap-2 items-start">
            <button
                id="save-btn"
                type="button"
                class="inline-flex items-center gap-2 px-3 py-1.5 text-sm font-medium rounded-md border border-neutral-300 dark:border-slate-700 bg-white dark:bg-muted hover:bg-neutral-100 dark:hover:bg-accent text-neutral-700 dark:text-neutral-200 transition-colors shadow-lg"
            >
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                    <polyline points="17 21 17 13 7 13 7 21"/>
                    <polyline points="7 3 7 8 15 8"/>
                </svg>
                Save
            </button>
            <div class="flex flex-col gap-1">
                <button
                    id="save-and-send-btn"
                    type="button"
                    class="inline-flex items-center gap-2 px-3 py-1.5 text-sm font-medium rounded-md bg-cyan-600 hover:bg-cyan-700 text-white transition-colors shadow-lg"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 2 11 13"/>
                        <path d="M22 2 15 22 11 13 2 9l20-7z"/>
                    </svg>
                    Save and send
                </button>
                <!-- Standaard uit: pas wanneer er via Delen / Doorsturen een
                     naam gekozen is, vinkt dit zichzelf aan -->
                <label
                    id="mail-toggle-wrap"
                    class="inline-flex items-center justify-center gap-1.5 px-2 py-0.5 rounded-md border border-neutral-300 dark:border-slate-700 bg-white dark:bg-muted hover:bg-neutral-100 dark:hover:bg-accent text-neutral-600 dark:text-neutral-300 shadow-lg cursor-pointer select-none transition-colors"
                >
                    <input
                        id="mail-send-cb"
                        type="checkbox"
                        class="w-3 h-3 rounded border-neutral-300 dark:border-slate-700 text-cyan-600 focus:ring-cyan-500"
                    />
                    <span class="text-[11px] leading-none">mail versturen</span>
                </label>
            </div>
        </div>

        <div class="h-full flex flex-col p-4 font-sans">

            <!-- Toolbar -->
            <div class="sticky top-0 z-10 flex justify-between mb-3 gap-2 py-2 pointer-events-none">
                <div class="pointer-events-auto">
                    <button
                        id="back-btn"
                        type="button"
                        class="inline-flex items-center gap-2 px-3 py-1.5 text-sm font-medium rounded-md border border-neutral-300 dark:border-slate-700 bg-white dark:bg-muted hover:bg-neutral-100 dark:hover:bg-accent text-neutral-700 dark:text-neutral-200 transition-colors shadow-sm"
                    >
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m15 18-6-6 6-6"/>
                        </svg>
                        Back
                    </button>
                </div>
            </div>

            <!-- Study and patient information (collapsed by default) -->
            <details
                class="w-full bg-white dark:bg-background border border-neutral-200 dark:border-slate-700 rounded-lg mb-3"
            >
                <summary
                    class="flex items-center gap-2 px-3 py-2 text-sm font-medium cursor-pointer text-neutral-900 dark:text-neutral-100 hover:bg-neutral-100 dark:hover:bg-accent rounded-lg"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                        <polyline points="14 2 14 8 20 8" />
                        <line x1="16" y1="13" x2="8" y2="13" />
                        <line x1="16" y1="17" x2="8" y2="17" />
                        <polyline points="10 9 9 9 8 9" />
                    </svg>
                    Study and patient information<span id="study-title-suffix" class="font-normal text-neutral-400 dark:text-neutral-500 truncate ml-1"></span>
                    <svg class="chevron ml-auto w-4 h-4 transition-transform duration-200 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m6 9 6 6 6-6" />
                    </svg>
                </summary>
                <div class="overflow-auto border-t border-neutral-200 dark:border-neutral-800">
                    <div data-tiro="study">
                        <tiro-form-filler
                            id="study-form"
                            sdc-endpoint-address="https://sdc.tiro.health/fhir/r5"
                            compact-grouping
                        />
                    </div>
                    <div data-nontemplate="study" class="hidden"></div>
                </div>
            </details>

            <!-- Database (open by default) -->
            <details
                open
                class="w-full bg-white dark:bg-background border border-neutral-200 dark:border-slate-700 rounded-lg mb-3"
            >
                <summary
                    class="flex items-center gap-2 px-3 py-2 text-sm font-medium cursor-pointer text-neutral-900 dark:text-neutral-100 hover:bg-neutral-100 dark:hover:bg-accent rounded-lg"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <ellipse cx="12" cy="5" rx="9" ry="3"/>
                        <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>
                        <path d="M3 12c0 1.66 4 3 9 3s9-1.34 9-3"/>
                    </svg>
                    Database
                    <svg class="chevron ml-auto w-4 h-4 transition-transform duration-200" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m6 9 6 6 6-6" />
                    </svg>
                </summary>
                <div class="overflow-auto border-t border-neutral-200 dark:border-neutral-800">
                    <div data-tiro="database">
                        <tiro-form-filler
                            id="database-form"
                            sdc-endpoint-address="https://sdc.tiro.health/fhir/r5"
                            compact-grouping
                        />
                    </div>
                    <div data-nontemplate="database" class="hidden"></div>
                </div>
            </details>

        </div>

        <!-- Tiro Web SDK -->
        <script src="https://cdn.tiro.health/sdk/next/tiro-web-sdk.iife.js"></script>

        <!-- Niet-template mode — zie het verwijder-recept bovenaan mountFormsUI in forms-shared.js -->
        <script src="forms-shared.js"></script>
        <script src="cases-schema.js"></script>

        <script>
            const STUDY_QUESTIONNAIRE = "http://templates.tiro.health/templates/dd231d6f2ccf4685afa5347afdab9f72|2.0.0";
            const DATABASE_QUESTIONNAIRE = "http://templates.tiro.health/templates/69bd126892b44111bc3d7ec5fb712b00|1.0.1";

            const params = new URLSearchParams(window.location.search);

            const launchContext = {
                custom: {
                    resourceType: "Parameters",
                    parameter: [
                        ...Array.from(params.entries()).map(([name, value]) => ({
                            name,
                            valueString: value,
                        })),
                    ],
                },
                patient: {
                    resourceType: "Patient",
                    identifier: [
                        { value: params.get("patientId") || "example-patient-id" },
                    ],
                },
            };

            const studyForm = document.getElementById("study-form");
            studyForm.setAttribute("launch-context", JSON.stringify(launchContext));
            studyForm.setAttribute("questionnaire", STUDY_QUESTIONNAIRE);

            const databaseForm = document.getElementById("database-form");
            databaseForm.setAttribute("launch-context", JSON.stringify(launchContext));
            databaseForm.setAttribute("questionnaire", DATABASE_QUESTIONNAIRE);

            // ── Samenvatting naast de titel ─────────────────────────────────
            // Toont pacsnummer - dag - onderzoek - aanvrager in het grijs, zoals
            // "Study and patient information" op launch.html. Werkt in beide modi
            // en blijft werken als de niet-template laag verwijderd wordt.
            const studyTitleSuffix = document.getElementById("study-title-suffix");

            function setStudySuffix(pacs, datum, onderzoek, aanvrager) {
                const parts = [pacs, datum, onderzoek, aanvrager].filter(Boolean);
                studyTitleSuffix.textContent = parts.length ? " " + parts.join(" - ") : "";
            }

            // Zoek een antwoord in een QuestionnaireResponse op basis van het label.
            function answerByLabel(response, ...searchTerms) {
                function walk(items) {
                    for (const item of items || []) {
                        const text = (item.text || "").toLowerCase();
                        if (searchTerms.some(t => text.includes(t.toLowerCase())) && item.answer?.length) {
                            const a = item.answer[0];
                            return a.valueString || a.valueCoding?.display || a.valueDate
                                || (a.valueBoolean !== undefined ? String(a.valueBoolean) : "") || "";
                        }
                        const nested = walk(item.item);
                        if (nested) return nested;
                    }
                    return "";
                }
                return walk(response?.item) || "";
            }

            // Template mode: uit het Tiro-formulier.
            studyForm.addEventListener("tiro-update", (event) => {
                const r = event.detail?.response;
                setStudySuffix(
                    answerByLabel(r, "pacsnummer", "pacs"),
                    answerByLabel(r, "onderzoek datum", "datum"),
                    answerByLabel(r, "onderzoek type", "type onderzoek", "type of examination"),
                    answerByLabel(r, "aanvrager", "referring"),
                );
            });

            // Niet-template mode: uit de eigen velden. Guard zodat het wegvallen
            // van forms-shared.js hier niets breekt.
            function refreshStudySuffixFromNative() {
                const native = document.querySelector('[data-nontemplate="study"]');
                if (!native || native.classList.contains("hidden") || !window.JyzForms) return;
                const v = JyzForms.SchemaForm.read(native, CASES_SCHEMAS.STUDY_SCHEMA);
                setStudySuffix(v.pacsnummer, v.onderzoek_datum, v.onderzoek_type, v.aanvrager);
            }

            // ── Label van het aanvinkvakje ──────────────────────────────────
            // Eén definitie van de ontvangers, ook gebruikt door recipientFrom.
            // Radioloog is meerkeuze, dus platmaken tot één lijst namen.
            const dbRecipient = (v) => [].concat(v.int_radioloog || [], v.opv_radioloog || []).filter(Boolean);

            const mailToggleWrap = document.getElementById("mail-toggle-wrap");
            const mailLabelSpan  = mailToggleWrap.querySelector("span");
            const mailSendCb     = document.getElementById("mail-send-cb");
            const MAIL_DEFAULT_TITLE = "Zet Delen / Doorsturen op Ja en kies een radioloog om te kunnen versturen";

            /**
             * Eén naam voluit; meerdere namen als de eerste plus het aantal, met
             * alle namen in de tooltip. Zo blijft de knop smal.
             */
            function formatRecipients(namen) {
                const list = [].concat(namen || []).filter(Boolean);
                if (!list.length) return { text: "mail versturen", title: MAIL_DEFAULT_TITLE };
                if (list.length === 1) return { text: list[0], title: "Mail versturen naar " + list[0] };
                const eerste = list[0].length > 14 ? list[0].slice(0, 13) + "…" : list[0];
                return {
                    text: eerste + " …(" + list.length + ")",
                    title: "Mail versturen naar:\n" + list.join("\n"),
                };
            }

            // Het vakje staat standaard uit en vinkt zichzelf aan zodra er een
            // naam bijkomt; verdwijnt de naam, dan gaat het weer uit. Wat je
            // daartussen zelf aanpast blijft staan.
            let _hadRecipient = false;
            function setMailLabel(namen) {
                const list = [].concat(namen || []).filter(Boolean);
                const { text, title } = formatRecipients(list);
                mailLabelSpan.textContent = text;
                mailToggleWrap.title = title;
                const heeft = list.length > 0;
                if (heeft !== _hadRecipient) {
                    mailSendCb.checked = heeft;
                    _hadRecipient = heeft;
                }
            }

            function refreshMailLabelFromNative() {
                const native = document.querySelector('[data-nontemplate="database"]');
                if (!native || native.classList.contains("hidden") || !window.JyzForms) return;
                setMailLabel(dbRecipient(JyzForms.SchemaForm.read(native, CASES_SCHEMAS.CASES_SCHEMA)));
            }

            // Template mode: uit het databaseformulier.
            databaseForm.addEventListener("tiro-update", (event) => {
                setMailLabel([answerByLabel(event.detail?.response, "radioloog")]);
            });

            function refreshDerivedFromNative() {
                refreshStudySuffixFromNative();
                refreshMailLabelFromNative();
            }
            document.addEventListener("input", refreshDerivedFromNative);
            document.addEventListener("change", refreshDerivedFromNative);

            // Terugknop. Is deze pagina in een eigen tabblad geopend vanaf
            // launch.html (Store case doet dat, zodat het werk en het PiP-venster
            // daar blijven staan), dan is teruggaan simpelweg dit tabblad sluiten:
            // navigeren zou een tweede launch-tabblad opleveren naast het eerste.
            document.getElementById("back-btn").addEventListener("click", () => {
                const geopendVanaf = window.opener && !window.opener.closed;
                if (geopendVanaf) {
                    try { window.opener.focus(); } catch (_) { /* andere origin */ }
                    window.close();
                    // Sluiten kan geweigerd worden; dan alsnog navigeren.
                    setTimeout(() => { window.location.href = `launch.html?${params.toString()}`; }, 150);
                    return;
                }
                window.location.href = `launch.html?${params.toString()}`;
            });

            // Save: submit both forms
            document.getElementById("save-btn").addEventListener("click", () => {
                studyForm.requestSubmit();
                databaseForm.requestSubmit();
            });

            const MAIL_FROM = "xavier.hoste@tiro.health";

            // ── Niet-template mode ──────────────────────────────────────────
            // Hangt bovenop de bestaande pagina en onderschept de save-knop
            // alleen wanneer de toggle op niet-template staat. Verwijderen: schrap
            // dit blok, de twee script-tags en de data-nontemplate containers.
            JyzForms.mountFormsUI({
                // page blijft "database": dat is de naam van de IndexedDB-tabel
                // en van de modus-sleutel, niet van de pagina.
                page: "database",
                primarySchema: CASES_SCHEMAS.CASES_SCHEMA,
                sections: [
                    {
                        tiro:   document.querySelector('[data-tiro="study"]'),
                        native: document.querySelector('[data-nontemplate="study"]'),
                        schema: CASES_SCHEMAS.STUDY_SCHEMA,
                    },
                    {
                        tiro:   document.querySelector('[data-tiro="database"]'),
                        native: document.querySelector('[data-nontemplate="database"]'),
                        schema: CASES_SCHEMAS.CASES_SCHEMA,
                    },
                ],
                saveBtn:        document.getElementById("save-btn"),
                saveAndSendBtn: document.getElementById("save-and-send-btn"),
                backBtn:        document.getElementById("back-btn"),
                // Versturen kan pas als de casus effectief gedeeld wordt met een
                // radioloog; welke tak actief is maakt niet uit.
                sendWhen: (v) =>
                    (v.int_delen === "Ja" && !!v.int_radioloog) ||
                    (v.opv_delen === "Ja" && !!v.opv_radioloog),
                recipientFrom: dbRecipient,
                // "mail versturen" uit betekent enkel bewaren.
                shouldSend: () => mailSendCb.checked,
                onSend: async (response, { recipient, naam }) => {
                    if (!recipient) throw new Error("Geen e-mailadres voor " + (naam || "de radioloog") + ".");
                    const res = await fetch("https://sdc.tiro.health/fhir/r5/QuestionnaireResponse/$send-notification", {
                        method: "POST",
                        headers: { "Content-Type": "application/fhir+json" },
                        body: JSON.stringify({
                            resourceType: "Parameters",
                            parameter: [
                                { name: "response", resource: response },
                                { name: "from", valueString: MAIL_FROM },
                                { name: "to", valueString: recipient },
                                { name: "subject", valueString: "Database radiologie — casus" },
                            ],
                        }),
                    });
                    if (!res.ok) throw new Error("HTTP " + res.status);
                },
            });

            // Samenvatting bijwerken na het opbouwen en bij het wisselen van modus.
            // Gaat de pagina naar template mode, dan wissen we ze en vult het
            // Tiro-formulier ze opnieuw via tiro-update.
            refreshDerivedFromNative();
            document.querySelector('[data-nontemplate-toggle]')?.addEventListener('click', () => {
                setTimeout(() => {
                    const native = document.querySelector('[data-nontemplate="study"]');
                    if (native && native.classList.contains('hidden')) { setStudySuffix(); setMailLabel([]); }
                    else refreshDerivedFromNative();
                }, 0);
            });
        </script>
    </body>
</html>
