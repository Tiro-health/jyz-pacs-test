<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Quality Control</title>

        <!-- Tailwind CSS CDN -->
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                darkMode: "class",
                theme: {
                    extend: {
                        fontFamily: {
                            sans: [
                                "Inter",
                                "system-ui",
                                "-apple-system",
                                "sans-serif",
                            ],
                        },
                        colors: {
                            background: "hsl(var(--background))",
                            muted: {
                                DEFAULT: "hsl(var(--muted))",
                                foreground: "hsl(var(--muted-foreground))",
                            },
                            accent: "hsl(var(--accent))",
                        },
                    },
                },
            };
        </script>

        <!-- Theme detection script (runs before render to prevent flash) -->
        <script>
            (function () {
                const params = new URLSearchParams(window.location.search);
                const themeParam = params.get("theme");

                let isDark;
                if (themeParam === "dark") {
                    isDark = true;
                } else if (themeParam === "light") {
                    isDark = false;
                } else if (localStorage.getItem("darkMode") !== null) {
                    isDark = localStorage.getItem("darkMode") === "true";
                } else {
                    isDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
                }

                if (isDark) {
                    document.documentElement.classList.add("dark");
                }
            })();
        </script>

        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lexend:wght@100..900&family=Fira+Mono:wght@400;500;700&display=swap"
            rel="stylesheet"
        />

        <style>
            tiro-form-filler {
                display: block;
                height: 100%;
            }

            details summary::-webkit-details-marker {
                display: none;
            }

            details summary {
                list-style: none;
            }

            details[open] .chevron {
                transform: rotate(180deg);
            }

            :root {
                --background: 0 0% 100%;
                --muted: 210 40% 96.1%;
                --muted-foreground: 215.4 16.3% 46.9%;
                --accent: 210 40% 90%;
                --dropdown-bg: #ffffff;
                --dropdown-text: #374151;
                --dropdown-text-muted: #6b7280;
                --dropdown-border: #d1d5db;
                --dropdown-border-hover: #9ca3af;
                --dropdown-hover: #f3f4f6;
                --dropdown-disabled-bg: #eceef0;
                --dropdown-disabled-text: #9ca3af;
                --dropdown-disabled-border: #d1d5db;
                --dropdown-multi-value-bg: #e5e7eb;
                --dropdown-multi-value-hover: #d1d5db;
                --dropdown-focus-ring: #006cd9;
                --dropdown-indicator-color: #374151;
            }

            :root.dark {
                --background: 206 27% 17%;   /* #1f2c36 — panels and form fields */
                --foreground: 215 20% 85%;
                --card: 206 27% 17%;
                --card-foreground: 215 20% 85%;
                --popover: 206 27% 17%;
                --popover-foreground: 215 20% 85%;
                --primary: 174 69% 20%;       /* #105750 — teal primary */
                --primary-foreground: 0 0% 100%;
                --secondary: 0 0% 24%;
                --secondary-foreground: 215 20% 85%;
                --muted: 0 0% 24%;            /* #3D3D3D — inactive buttons and secondary surfaces */
                --muted-foreground: 215 15% 55%;
                --accent: 210 30% 20%;        /* #243342 — hover states */
                --accent-foreground: 215 20% 85%;
                --input: 206 27% 17%;         /* #1f2c36 — input field backgrounds */
                --border: 206 26% 24%;        /* #2d3f4d — borders */
                --ring: 174 69% 20%;          /* #105750 — focus rings */
                --dropdown-bg: #1f2c36;
                --dropdown-text: #d1d9e1;
                --dropdown-text-muted: #8896a8;
                --dropdown-border: #2d3f4d;
                --dropdown-border-hover: #3a5068;
                --dropdown-hover: #243342;
                --dropdown-disabled-bg: #1a2530;
                --dropdown-disabled-text: #4b6080;
                --dropdown-disabled-border: #2d3f4d;
                --dropdown-multi-value-bg: #243342;
                --dropdown-multi-value-hover: #2d3f4d;
                --dropdown-focus-ring: #105750;
                --dropdown-indicator-color: #d1d9e1;
            }

            /* PACSonWeb dark mode: exact color overrides */
            :root.dark body {
                background-color: #161f27 !important;
            }
            :root.dark input:not([type="checkbox"]):not([type="radio"]),
            :root.dark select,
            :root.dark textarea {
                background-color: #1f2c36 !important;
                border-color: #2d3f4d !important;
            }
            :root.dark .bg-cyan-600 {
                background-color: #105750 !important;
            }
            :root.dark .hover\:bg-cyan-700:hover {
                background-color: #0b3e39 !important;
            }
            :root.dark .border-slate-700 {
                border-color: #2d3f4d !important;
            }
        </style>
    </head>
    <body class="bg-neutral-50 text-neutral-800 dark:bg-[#161f27] dark:text-neutral-200">

        <!-- PIN modal for secret copy button -->
        <div id="pin-modal" class="hidden fixed inset-0 z-[100] flex items-center justify-center bg-black/40">
            <div class="bg-white dark:bg-muted rounded-lg shadow-xl p-5 w-64 flex flex-col gap-3">
                <label class="text-sm font-medium text-neutral-700 dark:text-neutral-200">Code</label>
                <input id="pin-input" type="password" inputmode="numeric"

                    <button id="pin-cancel" type="button"
                        class="px-3 py-1.5 text-xs rounded-md border border-neutral-300 dark:border-slate-700 bg-white dark:bg-background text-neutral-700 dark:text-neutral-200 hover:bg-neutral-100 dark:hover:bg-accent">
                        Annuleer
                    </button>
                    <button id="pin-ok" type="button"
                        class="px-3 py-1.5 text-xs rounded-md bg-cyan-600 hover:bg-cyan-700 text-white">
                        OK

            </div>
        </div>

            <button

                type="button"
                class="w-2 h-2 rounded-full bg-neutral-400 dark:bg-neutral-600 opacity-20 hover:opacity-50 transition-opacity flex-shrink-0 border-0 p-0 cursor-pointer"

            <button

                type="button"
                class="inline-flex items-center gap-2 px-3 py-1.5 text-sm font-medium rounded-md border border-neutral-300 dark:border-slate-700 bg-white dark:bg-muted hover:bg-neutral-100 dark:hover:bg-accent text-neutral-700 dark:text-neutral-200 transition-colors shadow-lg"
            >

                    <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                    <polyline points="17 21 17 13 7 13 7 21"/>

                    <path d="M22 2 15 22 11 13 2 9l20-7z"/>
                </svg>

            <button

                title="Export / Import configuratie"

            ></button>
        </div>

        <!-- Export/Import modal -->
        <div id="export-import-modal" class="hidden fixed inset-0 z-[110] flex items-center justify-center bg-black/40">
            <div class="bg-white dark:bg-muted rounded-lg shadow-xl p-5 w-80 flex flex-col gap-4">
                <h2 class="text-sm font-semibold text-neutral-800 dark:text-neutral-100">Export / Import Configuratie</h2>
                <div class="flex flex-col gap-1.5">
                    <p class="text-xs text-neutral-500 dark:text-neutral-400">Download de huidige templates en instellingen als JSON-bestand.</p>
                    <button id="do-export-btn" class="w-full px-3 py-2 text-sm font-medium rounded-md bg-cyan-600 hover:bg-cyan-700 text-white transition-colors">⬇ Exporteer configuratie</button>
                </div>
                <div class="border-t border-neutral-200 dark:border-slate-700 pt-3 flex flex-col gap-1.5">
                    <p class="text-xs text-neutral-500 dark:text-neutral-400">Importeer een eerder geëxporteerd JSON-bestand. <span class="text-amber-600 dark:text-amber-400 font-medium">Huidige configuratie wordt overschreven.</span></p>
                    <label class="w-full px-3 py-2 text-sm font-medium rounded-md border border-neutral-300 dark:border-slate-700 text-neutral-700 dark:text-neutral-200 hover:bg-neutral-50 dark:hover:bg-slate-800 cursor-pointer text-center">
                        ⬆ Importeer configuratie

                </div>
                <button id="close-export-modal-btn" class="self-end px-3 py-1.5 text-xs rounded-md border border-neutral-300 dark:border-slate-700 text-neutral-600 dark:text-neutral-300 hover:bg-neutral-100 dark:hover:bg-accent">Sluiten</button>
            </div>

            <!-- Toolbar -->

                    <button

                    >
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m15 18-6-6 6-6"/>
                        </svg>
                        Back

            </div>

            <!-- Study and patient information (collapsed by default) -->
            <details
                class="w-full bg-white dark:bg-background border border-neutral-200 dark:border-slate-700 rounded-lg mb-3"
            >
                <summary
                    class="flex items-center gap-2 px-3 py-2 text-sm font-medium cursor-pointer text-neutral-900 dark:text-neutral-100 hover:bg-neutral-100 dark:hover:bg-accent rounded-lg"
                >
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="16"
                        height="16"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                        <polyline points="14 2 14 8 20 8" />
                        <line x1="16" y1="13" x2="8" y2="13" />
                        <line x1="16" y1="17" x2="8" y2="17" />
                        <polyline points="10 9 9 9 8 9" />
                    </svg>
                    Study and patient information
                    <svg
                        class="chevron ml-auto w-4 h-4 transition-transform duration-200"
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 24 24"

                        stroke="currentColor"

                        sdc-endpoint-address="https://sdc.tiro.health/fhir/r5"

                    />
                </div>
            </details>

            <!-- Quality control (open by default) -->
            <details
                open
                class="w-full bg-white dark:bg-background border border-neutral-200 dark:border-slate-700 rounded-lg mb-3"
            >
                <summary
                    class="flex items-center gap-2 px-3 py-2 text-sm font-medium cursor-pointer text-neutral-900 dark:text-neutral-100 hover:bg-neutral-100 dark:hover:bg-accent rounded-lg"
                >
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="16"
                        height="16"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path d="M9 11l3 3L22 4"/>
                        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
                    </svg>
                    Quality control
                    <svg
                        class="chevron ml-auto w-4 h-4 transition-transform duration-200"
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path d="m6 9 6 6 6-6" />
                    </svg>
                </summary>
                <div class="overflow-auto border-t border-neutral-200 dark:border-neutral-800">
                    <tiro-form-filler
                        id="qc-form"
                        sdc-endpoint-address="https://sdc.tiro.health/fhir/r5"
                        compact-grouping
                    />
                </div>
            </details>

        </div>

        <!-- Tiro Web SDK -->
        <script src="https://cdn.tiro.health/sdk/next/tiro-web-sdk.iife.js"></script>

        <script>
            const STUDY_QUESTIONNAIRE = "http://templates.tiro.health/templates/dd231d6f2ccf4685afa5347afdab9f72|2.0.0";
            const QC_QUESTIONNAIRE = "http://templates.tiro.health/templates/c44199b363f649b689b80468d582d838|2.0.0";

            const params = new URLSearchParams(window.location.search);

            const launchContext = {
                custom: {
                    resourceType: "Parameters",
                    parameter: [
                        ...Array.from(params.entries()).map(([name, value]) => ({
                            name,
                            valueString: value,
                        })),
                    ],
                },
                patient: {
                    resourceType: "Patient",
                    identifier: [
                        { value: params.get("patientId") || "example-patient-id" },
                    ],
                },
            };

            // Initialize study form
            const studyForm = document.getElementById("study-form");
            studyForm.setAttribute("launch-context", JSON.stringify(launchContext));
            studyForm.setAttribute("questionnaire", STUDY_QUESTIONNAIRE);

            // Initialize QC form
            const qcForm = document.getElementById("qc-form");
            qcForm.setAttribute("launch-context", JSON.stringify(launchContext));
            qcForm.setAttribute("questionnaire", QC_QUESTIONNAIRE);

            // Back button: return to launch.html preserving all URL params
            document.getElementById("back-btn").addEventListener("click", () => {
                window.location.href = `launch.html?${params.toString()}`;
            });

            // Save: submit both forms
            document.getElementById("save-btn").addEventListener("click", () => {
                studyForm.requestSubmit();
                qcForm.requestSubmit();
            });

            // Save and send: submit QC form, then send email via Tiro mail
            let sendAfterSubmit = false;
            document.getElementById("save-and-send-btn").addEventListener("click", () => {
                sendAfterSubmit = true;
                studyForm.requestSubmit();
                qcForm.requestSubmit();
            });

            const MAIL_FROM = "xavier.hoste@tiro.health";
            const MAIL_TO = "xavier.hoste@tiro.health";

            qcForm.addEventListener("tiro-submit", async (event) => {
                const response = event.detail.response;
                if (!sendAfterSubmit) return;
                sendAfterSubmit = false;

                try {
                    const saveAndSendBtn = document.getElementById("save-and-send-btn");
                    saveAndSendBtn.disabled = true;
                    saveAndSendBtn.textContent = "Sending...";

                    await fetch("https://sdc.tiro.health/fhir/r5/QuestionnaireResponse/$send-notification", {
                        method: "POST",
                        headers: { "Content-Type": "application/fhir+json" },
                        body: JSON.stringify({
                            resourceType: "Parameters",
                            parameter: [
                                { name: "response", resource: response },
                                { name: "from", valueString: MAIL_FROM },
                                { name: "to", valueString: MAIL_TO },
                                { name: "subject", valueString: "kwaliteitscontrole" },
                            ],
                        }),
                    });

                    saveAndSendBtn.textContent = "Sent!";
                    setTimeout(() => {
                        saveAndSendBtn.disabled = false;
                        saveAndSendBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22 11 13 2 9l20-7z"/></svg> Save and send`;
                    }, 2000);
                } catch (err) {
                    console.error("Mail send failed:", err);
                    alert("Form saved but email could not be sent: " + err.message);
                    const saveAndSendBtn = document.getElementById("save-and-send-btn");
                    saveAndSendBtn.disabled = false;
                    saveAndSendBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22 11 13 2 9l20-7z"/></svg> Save and send`;
                }
            });

            // Secret copy button: PIN-protected decrypt + copy
            (function() {
                const BLOBS = {
                    "secret-copy-btn":   "XkYgSRDJ4FR0d+q2t95wkezNOaQrrmnGeml5028FJwmSGPTDd94PvEu7r5P9MYPwP6homGyBC8hjd/rBddQ2EMRvUGeVwx0XGx3fxfexqJcXuZ8+UtSYOizWmUefs5jWDg==",
                    "secret-copy-btn-2": "CU+PYNGYBe1AHdjk7k+uBiUj0w4NKvbCCWjsgWD9/fMIxo6iUBHTNWwBzxLHIxNwSiCrA+44bZVvfA3SrHBNOnyx64IuwqqrAIEsLiIV9iHK8zQ=",
                };
                const pinModal = document.getElementById("pin-modal");
                const pinInput = document.getElementById("pin-input");
                const pinError = document.getElementById("pin-error");
                let activeBlob = null;
                let _exportPinPending = false;

                async function decrypt(blob, pin) {
                    const data = Uint8Array.from(atob(blob), c => c.charCodeAt(0));
                    const salt = data.slice(0, 16), iv = data.slice(16, 28), enc = data.slice(28);
                    const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pin), "PBKDF2", false, ["deriveKey"]);
                    const key = await crypto.subtle.deriveKey(
                        { name: "PBKDF2", salt, iterations: 100000, hash: "SHA-256" },
                        km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
                    );
                    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, enc);
                    return new TextDecoder().decode(plain);
                }

                function openPinModal(blob) {
                    activeBlob = blob;
                    pinInput.value = "";
                    pinError.classList.add("hidden");
                    pinModal.classList.remove("hidden");
                    setTimeout(() => pinInput.focus(), 50);
                }

                function closePinModal() {
                    pinModal.classList.add("hidden");
                    pinInput.value = "";
                    activeBlob = null;
                }

                async function tryDecrypt() {
                    const pin = pinInput.value;
                    if (_exportPinPending) {
                        if (pin === '8800') {
                            _exportPinPending = false;
                            closePinModal();
                            document.getElementById('export-import-modal').classList.remove('hidden');
                        } else {
                            pinError.classList.remove('hidden');
                            pinInput.value = '';
                            pinInput.focus();
                        }
                        return;
                    }
                    if (!pin || !activeBlob) return;
                    // Start decrypt and clipboard simultaneously to preserve user-gesture context
                    const decryptPromise = decrypt(activeBlob, pin);
                    try {
                        await navigator.clipboard.write([
                            new ClipboardItem({ "text/plain": decryptPromise.then(v => new Blob([v], { type: "text/plain" })) })
                        ]);
                        await decryptPromise;
                        closePinModal();
                    } catch {
                        // If ClipboardItem not supported, fall back to writeText
                        try {
                            const value = await decryptPromise;
                            await navigator.clipboard.writeText(value);
                            closePinModal();
                        } catch {
                            pinError.classList.remove("hidden");
                            pinInput.value = "";
                            pinInput.focus();
                        }
                    }
                }

                Object.entries(BLOBS).forEach(([id, blob]) => {
                    document.getElementById(id).addEventListener("click", () => openPinModal(blob));
                });
                document.getElementById("pin-ok").addEventListener("click", tryDecrypt);
                document.getElementById("pin-cancel").addEventListener("click", closePinModal);
                pinInput.addEventListener("keydown", (e) => {
                    if (e.key === "Enter") tryDecrypt();
                    if (e.key === "Escape") closePinModal();
                });
                pinModal.addEventListener("click", (e) => { if (e.target === pinModal) closePinModal(); });

                // Export / Import button (PIN 8800)
                document.getElementById('export-import-btn').addEventListener('click', () => {
                    _exportPinPending = true;
                    activeBlob = null;
                    pinInput.value = '';
                    pinError.classList.add('hidden');
                    pinModal.classList.remove('hidden');
                    setTimeout(() => pinInput.focus(), 50);
                });

                document.getElementById('close-export-modal-btn').addEventListener('click', () => {
                    document.getElementById('export-import-modal').classList.add('hidden');
                });
                document.getElementById('export-import-modal').addEventListener('click', (e) => {
                    if (e.target === document.getElementById('export-import-modal'))
                        document.getElementById('export-import-modal').classList.add('hidden');
                });

                document.getElementById('do-export-btn').addEventListener('click', () => {
                    const payload = {
                        version: '1.0',
                        timestamp: new Date().toISOString(),
                        flowConfig_v1: JSON.parse(localStorage.getItem('flowConfig_v1') || 'null'),
                        textTemplateLogic: localStorage.getItem('textTemplateLogic') || null,
                    };
                    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'flow-config-' + new Date().toISOString().slice(0,10) + '.json';
                    a.click();
                    URL.revokeObjectURL(url);
                });

                document.getElementById('import-file-input').addEventListener('change', async (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    try {
                        const text = await file.text();
                        const data = JSON.parse(text);
                        if (!confirm('Huidige configuratie overschrijven met de geïmporteerde data?')) {
                            e.target.value = '';
                            return;
                        }
                        if (data.flowConfig_v1) localStorage.setItem('flowConfig_v1', JSON.stringify(data.flowConfig_v1));
                        if (data.textTemplateLogic) localStorage.setItem('textTemplateLogic', data.textTemplateLogic);
                        alert('Configuratie succesvol geïmporteerd. De pagina wordt herladen.');
                        location.reload();
                    } catch {
                        alert('Ongeldig bestand. Zorg dat het een geldig JSON-exportbestand is.');
                        e.target.value = '';
                    }
                });
            })();
        </script>
    </body>
</html>
